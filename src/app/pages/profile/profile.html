@let user = auth.currentUser();

@if (user) {
  <div class="profile-container">
    <mat-card>
      <h2>Mon Profil</h2>

      <mat-list>
        <mat-list-item> <strong>Prénom :</strong> {{ user.firstname }} </mat-list-item>
        <mat-list-item> <strong>Nom :</strong> {{ user.lastname }} </mat-list-item>
        <mat-list-item> <strong>Email :</strong> {{ user.email }} </mat-list-item>
        <mat-list-item> <strong>ID :</strong> {{ user.id }} </mat-list-item>
      </mat-list>
    </mat-card>
  </div>
}
