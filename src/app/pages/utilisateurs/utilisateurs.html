<div class="table-container">

  <!-- 🔍 Champ de recherche -->
  <div class="search-bar">
    <div class="relative w-full max-w-md">

      <input type="text" placeholder="Rechercher un utilisateur..." [(ngModel)]="searchText" (input)="appliquerFiltre()"
        class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-md 
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500
           focus:border-blue-500" />

      <!-- Bouton pour effacer -->
      @if (searchText) {
      <button type="button" class="absolute right-8 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
        (click)="searchText=''; appliquerFiltre()">
        <mat-icon>close</mat-icon>
      </button>
      }

      <!-- Icône search -->
      <span class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400">
        <mat-icon>search</mat-icon>
      </span>

    </div>

  </div>

  <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- Avatar -->
    <ng-container matColumnDef="avatar">
      <th mat-header-cell *matHeaderCellDef>Avatar</th>
      <td mat-cell *matCellDef="let u">
        <img [src]="u.avatar" class="avatar">
      </td>
    </ng-container>

    <!-- Nom -->
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
      <td mat-cell *matCellDef="let u">{{ u.nom }}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <!-- Rôle -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rôle</th>
      <td mat-cell *matCellDef="let u">
        <span [class]="getBadgeClass(u.role)">
          {{ u.role }}
        </span>
      </td>
    </ng-container>

    <!-- État -->
    <ng-container matColumnDef="etat">
      <th mat-header-cell *matHeaderCellDef>Status</th>

      <td mat-cell *matCellDef="let u">

        <mat-select class="select-etat" [value]="u.actif" (selectionChange)="changerEtat(u, $event.value)">

          <mat-select-trigger>
            @if (u.actif) {
            <mat-icon fontSet="material-symbols-rounded" class="icon-success">check_circle</mat-icon>
            } @else {
            <mat-icon fontSet="material-symbols-rounded" class="icon-danger">cancel</mat-icon>
            }
          </mat-select-trigger>

          <mat-option [value]="true">
            <mat-icon fontSet="material-symbols-rounded" class="icon-success">check_circle</mat-icon>
          </mat-option>

          <mat-option [value]="false">
            <mat-icon fontSet="material-symbols-rounded" class="icon-danger">cancel</mat-icon>
          </mat-option>

        </mat-select>

      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Action</th>

      <td mat-cell *matCellDef="let u">

        <mat-select class="select-actions" [value]="'default'">

          <!-- Option masquée pour éviter select-empty -->
          <mat-option value="default" style="display:none;"></mat-option>

          <mat-select-trigger>
            <mat-icon fontSet="material-symbols-rounded" class="icon-action">settings</mat-icon>
          </mat-select-trigger>

          <mat-option>
            <mat-icon fontSet="material-symbols-rounded" class="icon-primary">edit</mat-icon>
          </mat-option>

          <mat-option>
            <mat-icon fontSet="material-symbols-rounded" class="icon-danger">delete</mat-icon>
          </mat-option>

        </mat-select>

      </td>
    </ng-container>




    <!-- Rendering rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>

</div>
