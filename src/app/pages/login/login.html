<div class="flex justify-center py-10">
  <mat-card class="w-[380px] p-6 shadow-md rounded-md">

    <h2 class="text-center text-2xl font-semibold mb-6">Connexion</h2>

    <!-- Boutons Google / Facebook -->
    <div class="flex gap-3 mb-6">
      <button type="button"
        class="flex items-center justify-center gap-2 flex-1 py-2 border border-blue-400 rounded-md bg-white text-blue-600 hover:bg-blue-50 transition">
        <img src="google.png" class="w-5 h-5" />
        Continuer avec Google
      </button>

      <button type="button"
        class="flex items-center justify-center gap-2 flex-1 py-2 border border-blue-400 rounded-md bg-white text-blue-600 hover:bg-blue-50 transition">
        <img src="facebook.png" class="w-5 h-5" />
        Continuer avec Facebook
      </button>
    </div>

    <!-- Séparateur -->
    <div class="flex items-center justify-center my-5 text-gray-500 text-sm">
      <div class="flex-1 h-px bg-gray-300"></div>
      <span class="px-3">ou continuez avec</span>
      <div class="flex-1 h-px bg-gray-300"></div>
    </div>

    <!-- Message d’erreur -->
    @if (error()) {
      <mat-card class="bg-red-50 text-red-700 p-3 mb-4 border-l-4 border-red-600">
        {{ error() }}
      </mat-card>
    }

    <form (ngSubmit)="login()" #f="ngForm" class="space-y-4">

      <!-- EMAIL (Tailwind) -->
      <div class="flex flex-col w-full">
        <label class="text-sm font-medium text-gray-700 mb-1">Email</label>

        <input
          id="email"
          name="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
          #emailCtrl="ngModel"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />

        @if (emailCtrl.invalid && emailCtrl.touched) {
          <p class="text-orange-500 text-sm mt-1">Email obligatoire</p>
        }
      </div>

      <!-- MOT DE PASSE (Tailwind) -->
      <div class="flex flex-col w-full">
        <label class="text-sm font-medium text-gray-700 mb-1">Mot de passe</label>

        <div class="relative">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
            #passCtrl="ngModel"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />

          <button
            type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
            (click)="togglePassword()"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>

        @if (passCtrl.invalid && passCtrl.touched) {
          <p class="text-orange-500 text-sm mt-1">Mot de passe obligatoire</p>
        }
      </div>

      <p class="text-right text-sm text-blue-600 cursor-pointer hover:underline -mt-2">
        Mot de passe oublié ?
      </p>

      <button mat-raised-button color="primary" class="w-full" [disabled]="f.invalid">
        Se connecter
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Pas encore de compte ?
      <a routerLink="/register" class="text-blue-600 hover:underline inline-flex items-center gap-1">
        Créez-en un <mat-icon class="text-base">account_circle</mat-icon>
      </a>
    </p>

  </mat-card>
</div>
