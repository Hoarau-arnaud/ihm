<!-- NAVBAR -->
<mat-toolbar class="navbar" @headerAppear>

  <!-- Logo -->
  <img src="favicon.ico" alt="Logo" class="navbar-logo" />

  <!-- Titre -->
  <span class="navbar-title">MyApp</span>

  <span class="spacer"></span>

  <!-- Menu desktop -->
  <nav class="navbar-links">
<a mat-button 
   routerLink="/" 
   routerLinkActive="active" 
   [routerLinkActiveOptions]="{ exact: true }">
  Accueil
</a>

<a mat-button routerLink="/actualites" routerLinkActive="active">
  Actualités
</a>

<a mat-button routerLink="/utilisateurs" routerLinkActive="active">
  Utilisateurs
</a>

<a mat-button routerLink="/card" routerLinkActive="active">
  Card
</a>

<a mat-button routerLink="/about" routerLinkActive="active">
  À propos
</a>



<button mat-raised-button color="accent"
        routerLink="/login"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
  Connexion
</button>

  </nav>

</mat-toolbar>


<!-- BOUTON MOBILE -->
@if (isMobile) {
  <button class="mobile-menu-toggle" (click)="toggleMenu()">
    {{ mobileMenuOpen ? '− Fermer' : '+ Menu' }}
  </button>
}


<!-- MENU MOBILE -->
@if (isMobile && mobileMenuOpen) {
  <div class="mobile-menu" @menuSlide>
    <a mat-button routerLink="/" (click)="closeMenu()">Accueil</a>
    <a mat-button routerLink="/about" (click)="closeMenu()">À propos</a>
    <a mat-button routerLink="/features" (click)="closeMenu()">Fonctionnalités</a>
    <a mat-button routerLink="/contact" (click)="closeMenu()">Contact</a>
  </div>
}
